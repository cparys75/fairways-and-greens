# Weekly copy of the whole database, kept 90 days as a download on the workflow run
# (Actions → Backup → a run → Artifacts). Cloudflare's own Time Travel covers the last 7 days.
# To restore: npx wrangler d1 execute fairways-and-greens --remote --file fairways-and-greens-YYYY-MM-DD.sql (into an empty database).
name: Backup
on:
  # Manual-only in this template. Add a schedule trigger (e.g. cron '17 9 * * 1') once deploying.
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export the database
        run: npx wrangler d1 export fairways-and-greens --remote --output "fairways-and-greens-$(date -u +%F).sql"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check it isn't empty
        run: test "$(grep -c 'INSERT INTO' fairways-and-greens-*.sql)" -gt 0
      - uses: actions/upload-artifact@v7
        with:
          name: fairways-and-greens-database
          path: fairways-and-greens-*.sql
          retention-days: 90
