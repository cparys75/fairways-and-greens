# Weekly pull requests for package updates (security fixes also come right away once
# "Dependabot security updates" is on in the repo's Settings → Security). Tests run on each.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Small updates arrive as one pull request; major versions come one at a time.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
